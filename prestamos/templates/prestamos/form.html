{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h2>{{ titulo }}</h2>
<form method="post" class="col-md-8 mx-auto">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-success mt-3">Guardar</button>
  <a href="{% url 'prestamos:lista' %}" class="btn btn-secondary mt-3">Cancelar</a>
</form>
{% endblock %}
